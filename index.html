<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Donut</title>
</head>
<body>

    <div class="donut-container">
        <pre id="donut"></pre>
    </div>

    <div class="theme-switch" id="themeSwitcher">
        <button class="toggle" id="themeToggle" aria-expanded="false" type="button">Theme <span aria-hidden="true">&#9662;</span></button>
        <div class="menu" id="themeMenu">
            <label><input type="radio" name="colorScheme" value="classic" checked> Classic</label>
            <label><input type="radio" name="colorScheme" value="ocean"> Ocean</label>
            <label><input type="radio" name="colorScheme" value="matrix"> Matrix</label>
            <label><input type="radio" name="colorScheme" value="amber"> Amber</label>
            <label><input type="radio" name="colorScheme" value="flashbang"> Flashbang</label>
        </div>
    </div>


    <script src="index.js"></script>
</body>
</html>
